services:
  markitdown-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: gugaucb/markdown-studio-ide:latest
    container_name: markdown-studio-ide
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEFAULT_LLM_MODEL=gemma4:26b
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
